<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Parfyum — Maison de Parfum</title>
<meta name="description" content="Atlas Parfyum: 3D flakonlar, orbital xushbo'y tuman, oltin puls, nota filtri, sevimlilar va onlayn buyurtma.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..700;1,400..600&family=Jost:wght@300;400;500;600&display=swap">
<style>
@property --tint{syntax:"<color>";inherits:true;initial-value:#2d4a6e}
:root{
  --bg:#f4ede2;
  --ink:#211119;
  --muted:#69545e;
  --card:rgba(33,17,25,.045);
  --card-hi:rgba(255,255,255,.72);
  --line:rgba(33,17,25,.14);
  --gold:#b57e22;
  --gold-hi:#ebbc5c;
  --tint:#2d4a6e;
  --shadow:0 24px 60px -24px rgba(33,17,25,.24);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#100914;
    --ink:#f8efe2;
    --muted:#c4b0bc;
    --card:rgba(255,255,255,.05);
    --card-hi:rgba(255,255,255,.12);
    --line:rgba(248,239,226,.14);
    --gold:#dca642;
    --gold-hi:#ffd882;
    --shadow:0 28px 70px -24px rgba(0,0,0,.68)
  }
}
:root[data-theme="dark"]{
  --bg:#100914;
  --ink:#f8efe2;
  --muted:#c4b0bc;
  --card:rgba(255,255,255,.05);
  --card-hi:rgba(255,255,255,.12);
  --line:rgba(248,239,226,.14);
  --gold:#dca642;
  --gold-hi:#ffd882;
  --shadow:0 28px 70px -24px rgba(0,0,0,.68)
}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));transition:--tint 1.4s cubic-bezier(.22,1,.36,1);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:300 16px/1.65 Jost,system-ui,-apple-system,sans-serif;
  overflow-x:hidden;
  transition:background .8s cubic-bezier(.22,1,.36,1),color .8s cubic-bezier(.22,1,.36,1);
  animation:pageEnter 1.1s cubic-bezier(.22,1,.36,1) both
}
@keyframes pageEnter{from{opacity:0}to{opacity:1}}

.lang-breath{
  position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--gold-hi) 18%,transparent),transparent 70%);
  transition:opacity .45s cubic-bezier(.22,1,.36,1)
}
.lang-breath.on{opacity:1}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;will-change:transform}
#trailCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}
.amb{
  position:fixed;inset:-18%;z-index:0;pointer-events:none;will-change:transform;
  background:
    radial-gradient(54% 64% at 72% 45%,color-mix(in srgb,var(--tint) 42%,transparent),transparent 72%),
    radial-gradient(46% 52% at 14% 88%,color-mix(in srgb,var(--tint) 26%,transparent),transparent 70%),
    radial-gradient(40% 44% at 88% 15%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 70%);
  filter:blur(32px);
  animation:ambDrift 18s ease-in-out infinite alternate;
  transition:background 1.2s ease
}
@keyframes ambDrift{
  0%{transform:translate3d(-1.5%,-1%,0) scale(1)}
  50%{transform:translate3d(1.5%,1.2%,0) scale(1.04)}
  100%{transform:translate3d(-0.8%,1.8%,0) scale(1.01)}
}
body::after{
  content:"";position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.055;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")
}
#sp{
  position:fixed;top:0;left:0;right:0;height:2.5px;
  background:linear-gradient(90deg,var(--gold),var(--gold-hi),var(--tint));
  transform-origin:0 50%;transform:scaleX(0);z-index:60;box-shadow:0 0 12px var(--gold)
}

.fly-orb{
  position:fixed;z-index:95;pointer-events:none;
  width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff6d6,var(--gold-hi) 48%,var(--tint));
  box-shadow:0 0 22px var(--gold-hi),0 0 40px var(--tint);
  transform:translate(-50%,-50%);
  transition:left .72s cubic-bezier(.22,1,.36,1),top .72s cubic-bezier(.22,1,.36,1),transform .72s cubic-bezier(.22,1,.36,1),opacity .72s ease
}

.serif{font-family:'Bodoni Moda',Georgia,serif;font-weight:500}

/* Header */
header{
  position:fixed;top:0;left:0;right:0;z-index:25;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 4vw 14px;
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 84%,transparent),color-mix(in srgb,var(--bg) 25%,transparent));
  border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  animation:hdrSlide .9s cubic-bezier(.22,1,.36,1) both
}
@keyframes hdrSlide{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.logo{
  font:italic 600 28px/1 'Bodoni Moda',Georgia,serif;letter-spacing:.02em;
  background:linear-gradient(120deg,var(--ink),var(--gold-hi) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent
}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Tugmalar & Folga yaltirashi */
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
.foil-shine{position:relative;overflow:hidden}
.foil-shine::before{
  content:"";position:absolute;top:-30%;left:-115%;width:55%;height:160%;
  background:linear-gradient(105deg,transparent,rgba(255,228,150,.38),rgba(255,255,255,.55),transparent);
  transform:skewX(-22deg);
  transition:left .68s cubic-bezier(.22,1,.36,1);
  pointer-events:none;z-index:3
}
.foil-shine:hover::before{left:145%}

.pill{
  background:var(--card);
  border:1px solid var(--line);
  padding:8px 16px;min-height:40px;
  border-radius:999px;
  font-size:13.5px;font-weight:400;letter-spacing:.03em;
  backdrop-filter:blur(10px);
  transition:transform .28s cubic-bezier(.22,1,.36,1),background .3s,color .3s,border-color .3s,box-shadow .35s
}
.pill:hover{
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--gold) 65%,var(--line));
  box-shadow:0 8px 22px -10px color-mix(in srgb,var(--gold) 55%,transparent)
}
.pill:active{transform:translateY(0) scale(.96)}
.pill.on{
  background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--ink) 75%,var(--tint)));
  color:var(--bg);
  border-color:var(--ink);
  font-weight:500;
  box-shadow:0 8px 24px -8px color-mix(in srgb,var(--tint) 60%,rgba(0,0,0,.35))
}
.cartb{
  border-color:color-mix(in srgb,var(--gold) 75%,transparent);
  background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 18%,var(--card)),var(--card));
  font-weight:500
}
.cartb:hover{
  background:linear-gradient(135deg,var(--gold),var(--gold-hi));
  color:#190e18;border-color:var(--gold)
}
.bump{animation:bump .55s cubic-bezier(.22,1,.36,1)}
@keyframes bump{35%{transform:scale(1.18)}70%{transform:scale(.95)}100%{transform:scale(1)}}

.mag-btn{will-change:transform;transition:transform .24s cubic-bezier(.22,1,.36,1),box-shadow .35s,filter .3s}
.buy{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--gold-hi) 0%,var(--gold) 55%,color-mix(in srgb,var(--gold) 78%,#3b1808) 100%);
  color:#190d16;
  padding:14px 30px;min-height:48px;
  border-radius:999px;
  font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;
  box-shadow:0 14px 32px -10px color-mix(in srgb,var(--gold) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.45)
}
.buy:hover{
  box-shadow:0 20px 40px -10px color-mix(in srgb,var(--gold) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.65);
  filter:brightness(1.04)
}
.buy:active{transform:scale(.97)!important}
.buy::after{
  content:"";position:absolute;top:-20%;left:-75%;width:45%;height:140%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
  transform:skewX(-22deg);animation:shine 3.8s ease-in-out infinite;pointer-events:none
}
@keyframes shine{0%,55%{left:-75%}85%,100%{left:140%}}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--gold-hi);outline-offset:3px
}

.soft-swap{animation:softReveal .58s cubic-bezier(.22,1,.36,1) both}
@keyframes softReveal{
  0%{opacity:0;filter:blur(7px);transform:translateY(10px)}
  100%{opacity:1;filter:blur(0);transform:none}
}

.num-pop{display:inline-block;animation:numPop .42s cubic-bezier(.22,1,.36,1) both}
@keyframes numPop{
  0%{opacity:.25;transform:translateY(7px) scale(.94)}
  100%{opacity:1;transform:none}
}

/* 3. Narx va hajm almashganda "Oltin Puls" */
.gold-pulse{
  border-radius:14px;
  animation:goldPulse .72s cubic-bezier(.22,1,.36,1) both
}
@keyframes goldPulse{
  0%{box-shadow:0 0 0 0 rgba(235,188,92,.75),0 0 18px rgba(235,188,92,.45);transform:scale(1.05)}
  100%{box-shadow:0 0 0 16px rgba(235,188,92,0),0 0 0 0 rgba(235,188,92,0);transform:scale(1)}
}

/* Filtrlar & 2.1 Nota filtri */
.controls-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.gender-bar,.note-filter-bar{
  display:inline-flex;gap:4px;padding:4px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);
  backdrop-filter:blur(12px);flex-wrap:wrap
}
.g-btn,.nf-btn{
  padding:6px 13px;border-radius:999px;font-size:12px;font-weight:400;letter-spacing:.03em;
  transition:all .32s cubic-bezier(.22,1,.36,1)
}
.g-btn.on,.nf-btn.on{
  background:linear-gradient(135deg,var(--gold),var(--gold-hi));
  color:#190d16;font-weight:600;box-shadow:0 6px 18px -6px var(--gold)
}
.g-btn:not(.on):hover,.nf-btn:not(.on):hover{background:var(--card-hi);transform:translateY(-1px)}

/* 3D Hero Stage */
#stage{position:relative;height:430vh;z-index:2}
.st{position:sticky;top:0;height:100vh;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;z-index:1;cursor:grab;touch-action:pan-y}
#c:active{cursor:grabbing}

.txt{position:absolute;z-index:3;left:5vw;top:51%;transform:translateY(-50%);max-width:530px}
.meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.badge{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);font-weight:500
}
.badge::before{content:"";width:18px;height:1px;background:var(--gold)}
.perf-pill{
  font-size:11.5px;padding:3px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--gold) 14%,var(--card));
  border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));
  color:var(--ink);letter-spacing:.02em
}

h1{
  font:500 clamp(44px,7.2vw,92px)/1 'Bodoni Moda',Georgia,serif;
  margin-bottom:12px;
  background:linear-gradient(105deg,var(--ink) 32%,var(--gold-hi) 50%,var(--ink) 68%) 0 0/250% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:hs 7.5s linear infinite
}
@keyframes hs{to{background-position:-250% 0}}
.note{color:var(--muted);max-width:44ch;margin-bottom:16px;min-height:3.2em;font-size:15px}
.scents{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px;max-width:510px}
.scents .pill{padding:6px 13px;min-height:35px;font-size:12.5px}
.sizes,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.price{font:500 32px/1 'Bodoni Moda',Georgia,serif;margin-right:6px;padding:4px 8px}

/* 2.2 Sevimlilar / Tanlanganlar (Wishlist) tugmasi */
.wish-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:12px 18px;min-height:48px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);
  font-size:13.5px;font-weight:400;transition:all .28s cubic-bezier(.22,1,.36,1)
}
.wish-btn:hover{border-color:var(--gold);transform:translateY(-2px)}
.wish-btn.on{
  border-color:var(--gold);
  background:color-mix(in srgb,var(--gold) 20%,var(--card));
  color:var(--gold-hi);font-weight:500
}

.cap{position:absolute;z-index:3;left:0;right:0;bottom:11vh;text-align:center;padding:0 6vw;pointer-events:none}
.cap h2{font:italic 500 clamp(30px,4.2vw,52px)/1.12 'Bodoni Moda',Georgia,serif;text-shadow:0 8px 30px rgba(0,0,0,.25)}
.cap p{color:var(--muted);margin-top:6px;font-size:16px}

.pyr{position:absolute;z-index:3;right:5vw;top:50%;width:min(400px,44vw);display:grid;gap:14px;transform:translateY(-50%)}
.pyr h2{font:italic 500 34px 'Bodoni Moda',Georgia,serif}
.pc{
  position:relative;overflow:hidden;
  border-left:2.5px solid var(--gold);padding:12px 18px;
  background:color-mix(in srgb,var(--card) 85%,var(--bg));
  border-radius:0 16px 16px 0;backdrop-filter:blur(14px);
  box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.22,1,.36,1),border-color .3s
}
.pc::after{
  content:"";position:absolute;left:0;bottom:0;height:2px;width:0;
  background:linear-gradient(90deg,var(--gold),var(--gold-hi));
  transition:width .9s cubic-bezier(.22,1,.36,1)
}
.pc.evo-on::after{width:100%}
.pc:hover{transform:translateX(-4px);border-color:var(--gold-hi)}
.pc small{color:var(--gold);text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:500;display:block;margin-bottom:2px}
.pc span{font-size:15.5px;font-weight:400}

/* Marquee */
.mq{
  overflow:hidden;white-space:nowrap;
  border-block:1px solid var(--line);padding:18px 0;
  position:relative;z-index:2;
  background:color-mix(in srgb,var(--card) 60%,transparent);backdrop-filter:blur(8px)
}
.mq div{display:inline-block;font:italic 500 32px 'Bodoni Moda',Georgia,serif;animation:mq 32s linear infinite;color:var(--muted)}
.mq span{margin:0 26px;transition:color .3s}
.mq span:hover{color:var(--gold)}
@keyframes mq{to{transform:translateX(-50%)}}

/* Sections & Reveal animations */
section.p{position:relative;z-index:2;padding:11vh 5vw}
section.p h2.t{font:500 clamp(32px,5vw,58px)/1.08 'Bodoni Moda',Georgia,serif;margin-bottom:12px}
.lead{color:var(--muted);max-width:56ch;margin-bottom:34px;font-size:16.5px}
.rv{opacity:0;transform:translateY(36px) scale(.985);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

.tilt-card{
  position:relative;
  transform-style:preserve-3d;
  will-change:transform;
  transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .35s ease,border-color .35s ease
}
.tilt-card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(255,244,214,.22),transparent 65%);
  opacity:0;transition:opacity .3s ease;z-index:2
}
.tilt-card:hover::after{opacity:1}

/* Sovg'a To'plami */
.gift{display:grid;grid-template-columns:1.05fr 1fr;gap:5vw;align-items:center}
.coffret-wrap{
  position:relative;
  padding:34px 28px 30px;
  border-radius:32px;
  background:
    radial-gradient(circle at 50% 25%,color-mix(in srgb,var(--gold-hi) 24%,transparent),transparent 65%),
    linear-gradient(155deg,color-mix(in srgb,var(--card-hi) 85%,transparent),var(--card));
  border:1px solid color-mix(in srgb,var(--gold) 38%,var(--line));
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35);
  overflow:hidden
}
.coffret-ribbon{
  position:absolute;top:16px;right:20px;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:var(--gold);padding:5px 12px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);
  background:color-mix(in srgb,var(--bg) 60%,transparent)
}
.coffret-tray{
  position:relative;
  display:flex;gap:20px;justify-content:center;align-items:flex-end;
  height:245px;padding-bottom:18px;
  border-bottom:1px solid color-mix(in srgb,var(--gold) 35%,var(--line))
}
.coffret-tray::after{
  content:"";position:absolute;left:8%;right:8%;bottom:-14px;height:22px;border-radius:10px;
  background:linear-gradient(90deg,#7c5210,var(--gold-hi),#8e5e14,var(--gold),#7c5210);
  box-shadow:0 12px 26px -6px rgba(0,0,0,.45)
}
.mb{
  width:76px;height:132px;border-radius:16px;
  border:1px solid rgba(255,255,255,.45);position:relative;overflow:hidden;
  background:linear-gradient(125deg,rgba(255,255,255,.48),rgba(255,255,255,.08));
  box-shadow:inset 0 0 24px rgba(255,255,255,.32),0 20px 34px -10px rgba(0,0,0,.4);
  animation:fl 4.4s ease-in-out infinite,seqGleam 5.4s ease-in-out infinite;
  animation-delay:var(--d),var(--seq,0s);
  transform:translateZ(18px)
}
.mb i{
  position:absolute;top:-30%;left:-140%;width:65%;height:160%;
  background:linear-gradient(105deg,transparent,rgba(255,250,220,.75),transparent);
  transform:skewX(-22deg);
  animation:mbSweep 5.4s ease-in-out infinite;
  animation-delay:var(--seq,0s);pointer-events:none
}
@keyframes mbSweep{0%,62%{left:-140%}82%{left:160%}100%{left:160%}}
@keyframes seqGleam{0%,62%{filter:brightness(1)}72%{filter:brightness(1.22)}84%,100%{filter:brightness(1)}}
.mb span{
  position:absolute;left:12%;right:12%;bottom:15%;
  padding:2px 4px;border-radius:4px;
  background:rgba(248,239,226,.94);color:#211119;
  font:italic 600 9.5px/1.2 'Bodoni Moda',Georgia,serif;text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.22);z-index:2
}
.mb::before{
  content:"";position:absolute;inset:34% 8% 8%;border-radius:10px;
  background:var(--c);opacity:.92;box-shadow:0 0 22px -3px var(--c)
}
.mb::after{
  content:"";position:absolute;left:28%;right:28%;top:-26px;height:26px;
  border-radius:7px 7px 3px 3px;
  background:linear-gradient(90deg,#875910,#f7d377,#875910);
  box-shadow:0 4px 10px rgba(0,0,0,.25)
}
@keyframes fl{0%,100%{transform:translate3d(0,0,18px) rotate(0deg)}50%{transform:translate3d(0,-13px,24px) rotate(2.2deg)}}
.coffret-meta{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-top:26px;font-size:13.5px;color:var(--muted)
}
.coffret-meta strong{color:var(--ink);font-weight:500}

/* Reviews */
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.rc{
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;
  backdrop-filter:blur(12px);box-shadow:var(--shadow)
}
.rc:hover{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));box-shadow:0 28px 58px -22px color-mix(in srgb,var(--tint) 55%,rgba(0,0,0,.38))}
.stars{color:var(--gold);letter-spacing:3px;display:inline-block;overflow:hidden;width:0;white-space:nowrap;transition:width 1.3s .35s cubic-bezier(.22,1,.36,1);margin-bottom:10px;font-size:15px}
.in .stars{width:7.6em}
.rc p{font-size:15.5px;line-height:1.62}
.rc b{display:block;margin-top:16px;font-weight:500;color:var(--gold);font-size:14px;letter-spacing:.03em}

/* FAQ Accordion */
.faq-list{display:grid;gap:12px;max-width:880px}
.faq-item{
  border:1px solid var(--line);border-radius:20px;
  background:var(--card);backdrop-filter:blur(12px);
  overflow:hidden;box-shadow:0 10px 30px -20px rgba(0,0,0,.25);
  transition:border-color .35s,background .35s,transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s
}
.faq-item:hover{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));transform:translateY(-2px)}
.faq-item.open{
  border-color:var(--gold);
  background:color-mix(in srgb,var(--card) 75%,var(--card-hi));
  box-shadow:0 18px 42px -22px color-mix(in srgb,var(--gold) 45%,transparent)
}
.faq-q{
  width:100%;text-align:left;padding:20px 24px;
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  font:500 clamp(18px,2.2vw,23px)/1.3 'Bodoni Moda',Georgia,serif;
  transition:color .3s
}
.faq-item.open .faq-q{color:var(--gold)}
.faq-icon{
  flex:none;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;position:relative;
  transition:transform .42s cubic-bezier(.22,1,.36,1),background .3s,border-color .3s
}
.faq-icon::before,.faq-icon::after{
  content:"";position:absolute;width:13px;height:1.6px;background:var(--gold);border-radius:2px;
  transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .3s
}
.faq-icon::after{transform:rotate(90deg)}
.faq-item.open .faq-icon{transform:rotate(180deg);background:var(--gold);border-color:var(--gold)}
.faq-item.open .faq-icon::before,.faq-item.open .faq-icon::after{background:#190d16}
.faq-item.open .faq-icon::after{transform:rotate(90deg) scale(0);opacity:0}

.faq-panel{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .45s cubic-bezier(.22,1,.36,1)
}
.faq-item.open .faq-panel{grid-template-rows:1fr}
.faq-inner{overflow:hidden}
.faq-body{
  padding:0 24px 22px;color:var(--muted);font-size:15.5px;line-height:1.72;
  opacity:0;transform:translateY(-6px);
  transition:opacity .38s .08s ease,transform .42s .08s cubic-bezier(.22,1,.36,1)
}
.faq-item.open .faq-body{opacity:1;transform:none}

/* Footer */
footer{
  position:relative;z-index:2;padding:34px 5vw;
  border-top:1px solid var(--line);color:var(--muted);font-size:14px;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
  background:color-mix(in srgb,var(--card) 50%,transparent)
}
footer a{color:var(--gold);text-decoration:none;font-weight:500;border-bottom:1px dashed transparent;transition:border-color .25s}
footer a:hover{border-bottom-color:var(--gold)}

/* Cart Drawer + 1.2 Silliq "erish" (Item Collapse) */
.ov{position:fixed;inset:0;background:rgba(10,5,12,.58);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .4s ease;z-index:35}
.ov.on{opacity:1;pointer-events:auto}
.dr{
  position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);
  background:var(--bg);z-index:36;
  transform:translateX(106%);visibility:hidden;
  transition:transform .52s cubic-bezier(.22,1,.36,1),visibility 0s .52s;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.35)
}
.dr.on{transform:none;visibility:visible;transition:transform .52s cubic-bezier(.22,1,.36,1)}
.dr:focus{outline:none}

.wish-box{
  padding:10px 12px;border-radius:16px;
  border:1px dashed color-mix(in srgb,var(--gold) 45%,var(--line));
  background:color-mix(in srgb,var(--gold) 7%,var(--card))
}
.wish-box small{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-weight:500}
.wish-chips{display:flex;gap:6px;flex-wrap:wrap}
.wish-chip{
  padding:5px 10px;border-radius:999px;font-size:12px;
  background:var(--card);border:1px solid var(--line);transition:all .25s
}
.wish-chip:hover{border-color:var(--gold);transform:translateY(-1px)}

.items{flex:1;min-height:90px;overflow:auto;display:grid;gap:10px;align-content:start}
.it{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 14px;border:1px solid var(--line);border-radius:16px;
  background:var(--card);
  transition:opacity .32s ease,transform .32s cubic-bezier(.22,1,.36,1),max-height .35s ease,padding .35s ease,margin .35s ease
}
.it.removing{
  opacity:0;transform:translateX(28px) scale(.92);
  max-height:0;padding-top:0;padding-bottom:0;margin:0;border-width:0;overflow:hidden
}
.q{display:flex;gap:8px;align-items:center}
.q button{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  font-size:16px;transition:transform .2s,background .25s,border-color .25s
}
.q button:hover{transform:scale(1.08);border-color:var(--gold);background:var(--card-hi)}
.q button:active{transform:scale(.92)}
.dr input,.dr select{
  width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;transition:border-color .25s,box-shadow .25s
}
.dr input:focus,.dr select:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent)}
.dr select option{background:var(--bg);color:var(--ink)}
.tot{display:flex;justify-content:space-between;font:500 24px 'Bodoni Moda',Georgia,serif;padding-top:6px;border-top:1px solid var(--line)}
.pt{font-size:13.5px;color:var(--muted)}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay button{
  padding:11px;border:1px solid var(--line);border-radius:14px;background:var(--card);
  min-height:44px;font-size:13.5px;transition:all .25s ease
}
.pay button:hover{border-color:color-mix(in srgb,var(--gold) 60%,var(--line));transform:translateY(-1px)}
.pay button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--card));font-weight:500;box-shadow:inset 0 0 0 1px var(--gold)}

/* Preloader */
#ld{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:grid;place-content:center;justify-items:center;gap:18px;
  transition:opacity .75s cubic-bezier(.22,1,.36,1),visibility .75s
}
#ld.off{opacity:0;visibility:hidden}
#ld i{display:block;width:170px;height:2px;background:var(--line);overflow:hidden;border-radius:2px}
#ld i::after{content:"";display:block;height:100%;width:45%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));animation:ldb 1.15s ease-in-out infinite}
@keyframes ldb{from{transform:translateX(-110%)}to{transform:translateX(250%)}}

@media(max-width:820px){
  .txt{top:auto;bottom:3.5vh;transform:none;right:5vw;max-width:90vw}
  .scents{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;max-width:90vw;scrollbar-width:none}
  .scents::-webkit-scrollbar{display:none}
  .scents .pill{flex:none}
  .pyr{top:auto;bottom:4vh;transform:none;width:90vw;right:5vw}
  .gift,.revs{grid-template-columns:1fr}
  .cap{bottom:34vh}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
  .faq-panel{grid-template-rows:1fr}
  .faq-body{opacity:1;transform:none}
  #trailCanvas,.fly-orb,.lang-breath{display:none}
}

function animateNum(el,text){

function flyToCart(sourceEl){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const cartBtn=$("cb");
  if(!sourceEl||!cartBtn)return;
  const r1=sourceEl.getBoundingClientRect();
  const r2=cartBtn.getBoundingClientRect();
  const orb=document.createElement("div");
  orb.className="fly-orb";
  orb.style.left=(r1.left+r1.width/2)+"px";
  orb.style.top=(r1.top+r1.height/2)+"px";
  document.body.appendChild(orb);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      orb.style.left=(r2.left+r2.width/2)+"px";
      orb.style.top=(r2.top+r2.height/2)+"px";
      orb.style.transform="translate(-50%,-50%) scale(.35)";
      orb.style.opacity="0.2";
    });
  });
  setTimeout(()=>orb.remove(),760);
}

function add(k,name,price,srcEl){
  const f=cart.find(x=>x.k==k);f?f.q++:cart.push({k,name,price,q:1});
  rc();
  flyToCart(srcEl);
  setTimeout(()=>{
    const badge=$("n").parentElement;
    badge.classList.remove("bump");void badge.offsetWidth;badge.classList.add("bump");

}

function rc(){
  try{localStorage.setItem("atlas",JSON.stringify(cart))}catch(e){}
  animateNum($("n"),String(cart.reduce((a,x)=>a+x.q,0)));
  const sb=cart.reduce((a,x)=>a+x.q*x.price,0),d=sb>=1e6||!sb?0:CT[ci][1];
  $("dv").textContent=d?fm(d):T[lang].free;
  $("fr").textContent=sb&&sb<1e6?T[lang].more+fm(1e6-sb):"";
  animateNum($("tt"),fm(sb+d));
  const w=$("items");w.innerHTML="";
  if(!cart.length){w.innerHTML="<p style='color:var(--muted)'>"+T[lang].empty+"</p>";return}
  cart.forEach(x=>{

    e.innerHTML="<div>"+x.name+"<br><small>"+fm(x.price)+"</small></div><div class='q'><button aria-label='-'>−</button><span>"+x.q+"</span><button aria-label='+'>+</button></div>";
    const [m,p]=e.querySelectorAll("button");
    /* 1.2 Silliq "erish" (Smooth Item Collapse) */

        e.classList.add("removing");

      g.addColorStop(1,"transparent");X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,rad*3.5,0,Math.PI*2);X.fill();
    }
  }else if(ty==="bokeh"){
    for(const p of fp){
      p.y-=(.22+p.v*.45)*spdScale;p.x+=Math.sin(t/1200+p.h)*.5*spdScale;
      if(p.y<-110){p.y=fh+110;p.x=Math.random()*fw}
      const rad=22+p.r*56;
      const g=X.createRadialGradient(p.x,p.y,rad*.1,p.x,p.y,rad);
      g.addColorStop(0,dark?"rgba(214,158,252,"+(.14*fa*calmAlpha)+")":"rgba(138,72,188,"+(.11*fa*calmAlpha)+")");
      g.addColorStop(1,"transparent");X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,rad,0,Math.PI*2);X.fill();
    }
  }else if(ty==="star"){
    for(const p of fp){
      p.x+=Math.cos(t/1600+p.h)*.22*spdScale;p.y+=Math.sin(t/1600+p.h)*.22*spdScale;
      const tw=.25+.75*Math.abs(Math.sin(t/650+p.h));
      X.save();X.globalAlpha=tw*.85*fa*calmAlpha;X.fillStyle=dark?"#dce4ff":"#2a398a";
      X.beginPath();X.arc(p.x,p.y,1.1+p.r*2.4,0,Math.PI*2);X.fill();X.restore();
    }
  }else if(ty==="snow"){
    for(const p of fp){
      p.y+=(.48+p.v*.85)*spdScale;p.x+=Math.sin(t/880+p.h)*.85*spdScale;
      if(p.y>fh+30){p.y=-30;p.x=Math.random()*fw}
      const rad=2+p.r*4.2;
      const g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,rad*2.2);
      g.addColorStop(0,dark?"rgba(255,235,190,"+(.7*fa*calmAlpha)+")":"rgba(184,142,62,"+(.5*fa*calmAlpha)+")");
      g.addColorStop(1,"transparent");X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,rad*2.2,0,Math.PI*2);X.fill();
    }
  }else{
    for(const p of fp){
      p.y-=(.35+p.v*.85)*spdScale;p.x+=Math.sin(t/900+p.h)*.7*spdScale;
      if(p.y<-30){p.y=fh+30;p.x=Math.random()*fw}
      const tw=.35+.65*Math.abs(Math.sin(t/520+p.h));
      const rad=1.8+p.r*4.5;
      const g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,rad*2.8);
      g.addColorStop(0,dark?"rgba(255,212,112,"+(.72*tw*fa*calmAlpha)+")":"rgba(182,126,34,"+(.55*tw*fa*calmAlpha)+")");
      g.addColorStop(1,"transparent");X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,rad*2.8,0,Math.PI*2);X.fill();
    }
  }
  X.globalAlpha=1;
}

const tcv=$("trailCanvas"),TX=tcv.getContext("2d");
let tw=0,th=0,trailPts=[];
function tsize(){tw=tcv.width=innerWidth;th=tcv.height=innerHeight}
addEventListener("resize",tsize);tsize();

addEventListener("pointermove",e=>{
  if(rm)return;
  const col="#"+S[cur].c.toString(16).padStart(6,"0");
  trailPts.push({x:e.clientX,y:e.clientY,r:2.2+Math.random()*4.2,vx:(Math.random()-.5)*1.1,vy:-.35-Math.random()*.9,a:1,col});
  if(trailPts.length>90)trailPts.shift();
});

function drawTrail(){
  if(rm)return;
  TX.clearRect(0,0,tw,th);
  for(let i=trailPts.length-1;i>=0;i--){
    const p=trailPts[i];
    p.x+=p.vx;p.y+=p.vy;p.a-=.024;
    if(p.a<=0){trailPts.splice(i,1);continue}
    TX.save();TX.globalAlpha=p.a*.62;
    const gr=TX.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.4);
    gr.addColorStop(0,p.col);gr.addColorStop(1,"transparent");
    TX.fillStyle=gr;TX.beginPath();TX.arc(p.x,p.y,p.r*2.4,0,Math.PI*2);TX.fill();TX.restore();
  }
}

const tgt=new THREE.Color(S[0].c);
let spin=.006,drag=false,lx=0,dr=0,rot=0,spp=0,prevSpp=0,sloshAngle=0,sloshVel=0,burstWave=0,autoSprayDone=false;
const ambEl=$("ambLayer");

cv.onpointerdown=e=>{drag=true;lx=e.clientX};
addEventListener("pointerup",()=>drag=false);
addEventListener("pointermove",e=>{
  if(drag){
    const dx=(e.clientX-lx)*.01;
    dr+=dx;sloshVel+=dx*2.4;lx=e.clientX;
  }
});

function size(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener("resize",size);size();

const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const st=$("stage"),hero=$("hero"),capE=$("cap"),py=$("pyr");

function loop(t){
  requestAnimationFrame(loop);
  const r=st.getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/(r.height-innerHeight)));
  spp+=(p-spp)*.08;
  const scrollDelta=(spp-prevSpp)*18;
  prevSpp=spp;

  /* 1.4 Footer yaqinlashganda "Yakuniy Nafas" */
  const maxSc=Math.max(1,document.documentElement.scrollHeight-innerHeight);
  const pageProg=Math.min(1,Math.max(0,scrollY/maxSc));
  const targetCalm=ss(.78,1,pageProg);
  endCalm+=(targetCalm-endCalm)*.06;

  if(!rm&&ambEl){
    ambEl.style.transform="translate3d("+(-1.5+spp*3.5)+"%,"+(-1+spp*-6)+"%,0) scale("+(1+spp*.05-endCalm*.03)+")";
    fx.style.transform="translate3d(0,"+(-spp*42)+"px,0)";
  }

  const openProg=ss(.35,.55,spp);
  if(openProg>.45 && !autoSprayDone){autoSprayDone=true;triggerMistSpray()}
  else if(openProg<.15){autoSprayDone=false}

  const m=cv.clientWidth<820,k=1-Math.pow(1-Math.min(Math.max(t-t0,0)/2200,1),3);
  const x=m?0:2.65*(1-ss(.15,.4,spp))-2.65*ss(.62,.8,spp);
  const liftY=(m?1.25:-1)+(1-k)*4+Math.sin(t/900)*.06;
  g.position.x=x;
  g.position.y=liftY;
  g.scale.setScalar((m?.68:1)*(1+ss(.3,.5,spp)*.15)*(.6+.4*k));

  const distFactor=Math.max(.55,1-Math.max(0,liftY+1)*.09-openProg*.18);
  sh.scale.setScalar(distFactor);
  sh.material.opacity=.48*distFactor;
  glow.scale.setScalar(.75+.35*distFactor);
  gm.opacity=.32+.28*distFactor;

  const spinRate=.006*(1-endCalm*.65);
  spin+=(spinRate-spin)*.03;dr*=.96;rot+=spin;
  g.rotation.y=rot+spp*Math.PI*2+dr;
  g.rotation.x=Math.sin(t/2000)*.04;

  sloshVel+=(-sloshAngle*.06)+(scrollDelta*.12)+Math.sin(t/450)*.0015;
  sloshVel*=.91;
  sloshAngle+=sloshVel;
  liqGroup.rotation.z=Math.max(-.28,Math.min(.28,sloshAngle));
  liqGroup.rotation.x=Math.max(-.18,Math.min(.18,sloshAngle*.55));

  for(let i=0;i<DROP_N;i++){
    const d=dropData[i];
    d.y-=d.spd*(1-endCalm*.5);
    if(d.y<-1.15){d.y=.95;d.ang=(Math.random()-.5)*Math.PI*1.1}
    const wob=Math.sin(t/500+i)*.025;
    dropPos[i*3]=Math.sin(d.ang+wob)*curRadZ;
    dropPos[i*3+1]=d.y;
    dropPos[i*3+2]=Math.cos(d.ang+wob)*curRadZ;
  }
  dropGeo.attributes.position.needsUpdate=true;

  /* 1.1 Orbital Xushbo'y Tuman yangilanishi */
  const orbSpdScale=1-endCalm*.6;
  for(let i=0;i<ORB_N;i++){
    const o=orbMeta[i];
    o.ang+=o.spd*orbSpdScale;
    const radNow=o.rad+Math.sin(t/750+o.bob)*.18;
    orbPos[i*3]=Math.cos(o.ang)*radNow;
    orbPos[i*3+1]=o.y+Math.sin(t/600+o.bob)*.22;
    orbPos[i*3+2]=Math.sin(o.ang)*radNow;
  }
  orbGeo.attributes.position.needsUpdate=true;
  orbMat.color.copy(lm.color);
  orbMat.opacity=(.36+.14*Math.sin(t/800))*(1-endCalm*.55);

  const breath=1+.11*Math.sin(t/950);
  haloMesh.scale.setScalar(breath);
  haloMat.color.copy(lm.color);
  haloMat.opacity=(.18+.1*Math.sin(t/950))*(1-endCalm*.45);

  nozzlePress+=(0-nozzlePress)*.18;
  nozzle.position.y=curTopY-.12-nozzlePress*.09;
  if(mistLife>0){
    mistLife=Math.max(0,mistLife-.022);
    mMat.opacity=mistLife*.85;
    for(let i=0;i<MIST_N;i++){
      mPos[i*3]+=mVel[i*3];mPos[i*3+1]+=mVel[i*3+1];mPos[i*3+2]+=mVel[i*3+2];
      mVel[i*3]*=.96;mVel[i*3+1]-=.0018;mVel[i*3+2]*=.96;
    }
    mGeo.attributes.position.needsUpdate=true;
  }

  if(burstWave>0){
    burstWave=Math.max(0,burstWave-.026);
    const scWave=1+(1-burstWave)*2.4;
    burstMesh.scale.setScalar(scWave);
    burstMat.color.copy(lm.color);
    burstMat.opacity=burstWave*.75;
  }

  const swAng=(t/1900)%(Math.PI*2);
  sweepLight.position.x=Math.cos(swAng)*6.5;
  sweepLight.position.z=Math.sin(swAng)*6.5;
  sweepLight.position.y=3.5+Math.sin(swAng*2)*1.5;

  cg.position.y=openProg*1.55;
  cg.rotation.y=openProg*2;

  lm.color.lerp(tgt,.06);
  pmat.color.copy(lm.color);lm.attenuationColor.copy(lm.color);gm.color.copy(lm.color);rl.color.copy(lm.color);

  fxd(t);
  drawTrail();

  $("sp").style.transform="scaleX("+pageProg+")";
  const ma=ss(.4,.6,spp)*(1-ss(.9,1,spp)*.5)*(1-endCalm*.5);pmat.opacity=ma*.55;
  for(let i=0;i<N;i++){pp[i*3+1]+=vy[i]*(.5+ma*2)*orbSpdScale;pp[i*3]+=Math.sin(t/700+i)*.003;if(pp[i*3+1]>6)rs(i,false)}
  pg.attributes.position.needsUpdate=true;

  const h=1-ss(.12,.3,spp);
  hero.style.opacity=h;
  hero.style.transform=(m?"":"translateY(-50%) ")+"translateX("+(-40*(1-h))+"px)";
  hero.style.pointerEvents=h<.3?"none":"auto";

  const c=ss(.38,.5,spp)*(1-ss(.58,.68,spp));
  capE.style.opacity=c;capE.style.transform="translateY("+(20*(1-c))+"px)";

  [...py.children].forEach((e,i)=>{
    if(!e.classList.contains("pc"))return;
    const v=ss(.68+i*.06,.76+i*.06,spp);
    e.style.opacity=v;
    e.style.transform="translateX("+(50*(1-v))+"px)";
    e.classList.toggle("evo-on",v>.75);
  });
  R.render(sc,cam);
}

shape(0);
document.fonts.ready.then(()=>{
  label();
  setTimeout(()=>{t0=performance.now();$("ld").classList.add("off")},650);
});
label();
tx();
requestAnimationFrame(loop);
</script>
